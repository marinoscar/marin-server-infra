# =============================================================================
# Sink — Production Docker Compose
# =============================================================================
# Generated by install-sink.sh
# Do not edit manually — re-run the installer to regenerate.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx — Internal reverse proxy (routes /api → api, / → web)
  # ---------------------------------------------------------------------------
  nginx:
    container_name: sink-nginx
    image: nginx:alpine
    ports:
      - "127.0.0.1:8321:80"
    volumes:
      - ./repo/infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - sink-internal

  # ---------------------------------------------------------------------------
  # API — NestJS Backend (Fastify)
  # ---------------------------------------------------------------------------
  api:
    container_name: sink-api
    build:
      context: ./repo/apps/api
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - sink-internal

  # ---------------------------------------------------------------------------
  # Web — React Frontend (static build served by Nginx)
  # ---------------------------------------------------------------------------
  web:
    container_name: sink-web
    build:
      context: ./repo/apps/web
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sink-internal

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal network for service-to-service communication
  sink-internal:
    driver: bridge
