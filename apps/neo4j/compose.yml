# =============================================================================
# Neo4j Community — /opt/infra/apps/neo4j/compose.yml
# =============================================================================
# Generated by install-neo4j.sh
# Documented in /opt/infra/docs/neo4j-setup.md
#
# Browser UI: bound to 127.0.0.1:7474 and proxied by Nginx (graph.marin.cr).
# Bolt:       bound to 0.0.0.0:7687 with Neo4j-managed TLS (Let's Encrypt cert
#             from /opt/infra/proxy/letsencrypt is copied into ./ssl by
#             sync-certs.sh and re-synced on renewal).
#
#             Bolt is ALSO reachable via Nginx on port 443 as a WebSocket
#             (wss://graph.marin.cr) — this is what mobile/Browser clients use,
#             since many carriers block outbound 7687. Direct Bolt clients
#             (cypher-shell, driver libraries) keep using 7687 with raw TCP.
#             Advertised address is :443 so Browser auto-fills the right URL.
#
# Env-var naming rules (Neo4j Docker image):
#   property "a.b.c"          -> env "NEO4J_a_b_c"
#   property "a.b_c"          -> env "NEO4J_a_b__c"   (single _ -> __)
# =============================================================================

services:
  neo4j:
    image: neo4j:5-community
    container_name: infra-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP Browser UI — proxied by Nginx
      - "0.0.0.0:7687:7687"     # Bolt — public, TLS terminated by Neo4j
    environment:
      # ----- Auth -----
      NEO4J_AUTH: ${NEO4J_AUTH}

      # ----- Plugins (auto-downloaded by the image on first start) -----
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

      # ----- Memory (tune to host capacity) -----
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"

      # ----- Advertised address (so Browser knows where Bolt lives) -----
      # Bolt advertises :443 so Browser uses wss:// through Nginx (works on
      # mobile networks that block 7687). Direct clients can still hit :7687.
      NEO4J_server_default__advertised__address: "graph.marin.cr"
      NEO4J_server_bolt_advertised__address: "graph.marin.cr:443"
      NEO4J_server_http_advertised__address: "graph.marin.cr:443"

      # ----- Bolt TLS — uses LE cert mounted read-only at /ssl -----
      NEO4J_server_bolt_tls__level: "OPTIONAL"
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: "/ssl"
      NEO4J_dbms_ssl_policy_bolt_private__key: "privkey.pem"
      NEO4J_dbms_ssl_policy_bolt_public__certificate: "fullchain.pem"
      NEO4J_dbms_ssl_policy_bolt_client__auth: "NONE"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./plugins:/plugins
      - ./conf:/conf
      - ./ssl:/ssl:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - internal

networks:
  internal:
    driver: bridge
