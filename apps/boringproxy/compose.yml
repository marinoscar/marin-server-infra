services:
  boringproxy:
    container_name: boringproxy
    build:
      context: .
      dockerfile: Dockerfile
    image: boringproxy:local
    restart: unless-stopped

    environment:
      - USER=root

    command:
      - server
      - -admin-domain
      - proxy.marin.cr
      - -behind-proxy
      - -allow-http
      - -http-port
      - "8080"
      - -public-ip
      - 195.26.247.169

    # ✅ expose boringproxy only to the VPS itself (not the public internet)
    ports:
      - "127.0.0.1:18080:8080"

    volumes:
      - ./data:/storage