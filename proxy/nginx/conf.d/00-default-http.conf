server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # This directory is where certbot writes challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For now: show a simple message on HTTP so you know it's working.
    # Later you can change this to a redirect to HTTPS.
    location / {
        return 200 "OK: nginx is running (HTTP)\n";
        add_header Content-Type text/plain;
    }
}
