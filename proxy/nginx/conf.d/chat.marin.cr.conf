# =============================================================================
# LibreChat - VPS Reverse Proxy Configuration
# =============================================================================
# Location on VPS: /opt/infra/proxy/nginx/conf.d/chat.marin.cr.conf
#
# Routes chat.marin.cr to LibreChat API container via localhost port 3080.
# Includes WebSocket support for chat streaming.
#
# TLS handled by Let's Encrypt / Certbot.
# =============================================================================

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name chat.marin.cr;

    ssl_certificate     /etc/letsencrypt/live/chat.marin.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.marin.cr/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size limit for file uploads
    client_max_body_size 100m;

    location / {
        set $upstream http://127.0.0.1:3080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# HTTP -> HTTPS redirect + ACME challenge support
server {
    listen 80;
    server_name chat.marin.cr;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
