server {
  listen 80;
  server_name proxy.marin.cr;

  # ACME challenge path (Certbot uses this)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Everything else -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name proxy.marin.cr;

  ssl_certificate     /etc/letsencrypt/live/proxy.marin.cr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/proxy.marin.cr/privkey.pem;

  # decent baseline
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  location / {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # optional but often nice
    proxy_set_header X-Real-IP $remote_addr;
  }
}
