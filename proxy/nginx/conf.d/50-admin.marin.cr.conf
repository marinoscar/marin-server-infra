# admin.marin.cr
# - HTTP: ACME challenge + redirect to HTTPS
# - HTTPS: Basic Auth protected reverse proxy to Cockpit (host:9090)
# - Heartbeat: unauthenticated endpoint for external uptime monitors (StatusCake/UptimeRobot/etc)

server {
    listen 80;
    server_name admin.marin.cr;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Optional: allow heartbeat checks over plain HTTP too (comment out if you want HTTPS-only)
    location = /heartbeat {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.marin.cr;

    ssl_certificate     /etc/letsencrypt/live/admin.marin.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.marin.cr/privkey.pem;

    # Basic Auth for the admin site by default
    auth_basic "Restricted Admin Access";
    auth_basic_user_file /etc/nginx/snippets/auth/admin.htpasswd;

    # Heartbeat endpoint for external monitoring
    # IMPORTANT: auth_basic off overrides the server-level auth.
    location = /heartbeat {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "OK\n";
    }

    # Proxy to Cockpit on the host
    location / {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Cockpit uses them)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_pass http://127.0.0.1:9090;
    }
}
