# =============================================================================
# graph.marin.cr — VPS Reverse Proxy Config (Neo4j Browser + Bolt over WSS)
# =============================================================================
# Source:  /opt/infra/apps/neo4j/graph.conf
# Live:    /opt/infra/proxy/nginx/conf.d/graph.conf
# Managed by: install-neo4j.sh (copies this file into the proxy conf.d)
#
# Routing strategy:
#   - Plain HTTP requests   -> 127.0.0.1:7474 (Neo4j Browser UI)
#   - WebSocket-upgrade     -> 127.0.0.1:7687 (Bolt)
#
# Why: mobile carriers block non-standard outbound ports like 7687. Routing
# Bolt-over-WebSocket through port 443 makes Neo4j Browser reachable from any
# network. Direct Bolt clients (cypher-shell, drivers with explicit port) can
# still connect on 7687 with raw TCP Bolt.
#
# The map below switches the upstream port based on whether the request is a
# WebSocket upgrade. The $connection_upgrade variable is defined globally in
# /opt/infra/proxy/nginx/conf.d/05-websocket-map.conf
# =============================================================================

map $http_upgrade $neo4j_upstream_port {
    default   7474;   # Browser UI (HTTP)
    websocket 7687;   # Bolt (WebSocket-over-TLS)
}

server {
    listen 443 ssl;
    http2 on;
    server_name graph.marin.cr;

    ssl_certificate     /etc/letsencrypt/live/graph.marin.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graph.marin.cr/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:$neo4j_upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers (Bolt-over-WS connections require these).
        # $connection_upgrade is defined globally in 05-websocket-map.conf
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Bolt connections are long-lived — match Neo4j's idle timeout (1h).
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name graph.marin.cr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
