# =============================================================================
# OpenClaw - VPS Reverse Proxy Configuration
# =============================================================================
# Location on VPS: /opt/infra/proxy/nginx/conf.d/openclaw.marin.cr.conf
#
# Routes openclaw.marin.cr to OpenClaw Gateway via localhost port 18789.
# Includes WebSocket support for gateway communication.
# Auth: Authentik forward auth (same pattern as admin.marin.cr)
# SSH access is direct on port 2222, not proxied through nginx.
#
# TLS handled by Let's Encrypt / Certbot.
# =============================================================================

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name openclaw.marin.cr;

    ssl_certificate     /etc/letsencrypt/live/openclaw.marin.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.marin.cr/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Authentik forward auth
    include /etc/nginx/snippets/authentik-forward-auth.conf;
    auth_request        /outpost.goauthentik.io/auth/nginx;
    auth_request_set    $auth_cookie $upstream_http_set_cookie;
    error_page          401 = @goauthentik_proxy_signin;

    location / {
        set $upstream http://127.0.0.1:18789;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# HTTP -> HTTPS redirect + ACME challenge support
server {
    listen 80;
    server_name openclaw.marin.cr;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
