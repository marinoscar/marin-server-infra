# =============================================================================
# OpenClaw - SSH Dev Container Landing Page
# =============================================================================
# Location on VPS: /opt/infra/proxy/nginx/conf.d/openclaw.marin.cr.conf
#
# This is an informational landing page only. SSH access is direct on port 2222,
# not proxied through nginx.
#
# TLS handled by Let's Encrypt / Certbot.
# =============================================================================

# HTTP -> HTTPS redirect + ACME challenge support
server {
    listen 80;
    server_name openclaw.marin.cr;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
