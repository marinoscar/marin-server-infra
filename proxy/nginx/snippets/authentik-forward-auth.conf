# Authentik forward auth snippet (reusable across services)
# Include this in any HTTPS server block that needs Authentik protection.
# Requires: Authentik running on 127.0.0.1:9000

# Outpost location — handles auth subrequests AND browser start/callback flows
# NOT marked internal: the browser must reach /outpost.goauthentik.io/start and /callback
location /outpost.goauthentik.io {
    proxy_pass          http://127.0.0.1:9000/outpost.goauthentik.io;
    proxy_pass_request_body off;
    proxy_set_header    Content-Length "";
    proxy_set_header    Host $http_host;
    proxy_set_header    X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
}

# Redirect handler for 401 responses (sends user to outpost start on same domain)
location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
}
